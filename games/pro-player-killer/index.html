<script>
(()=>{
'use strict';
/* =========================================================
   PRO PLAYER KILLER
   ========================================================= */
const cvs=document.getElementById('c');let ctx=cvs.getContext('2d');
const H=470,GY=440;
let VW=960,VH=540,S=1,DPR=1,offY=0,groundSY=440,frame=0,touchMode=false;
const SAFE={l:0,r:0,t:0,b:0};
const FS='"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Times New Roman",serif';
const FG='"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif';
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a);
const ease=t=>1-(1-t)*(1-t);
const hash=n=>{const s=Math.sin(n*12.9898+78.233)*43758.5453;return s-Math.floor(s)};
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

/* ---------------- INPUT ---------------- */
const ACT=['left','right','jump','attack','dodge','parry','super','sk1','sk2'];
const kb={},tc={},buf={};ACT.forEach(a=>{kb[a]=0;tc[a]=0;buf[a]=0});
let anyPress=false,tapPress=false,pausePress=false;
const BUF=9;
const held=a=>!!(kb[a]||tc[a]||(typeof gp!=='undefined'&&gp[a]));
const lastTap={};function press(a){buf[a]=BUF;anyPress=true;if(a==='left'||a==='right'){if(frame-(lastTap[a]===undefined?-99:lastTap[a])<14)G.dashReq=a;lastTap[a]=frame}}
function consume(a){if(buf[a]>0){buf[a]=0;return true}return false}
function clearBuf(){ACT.forEach(a=>buf[a]=0);anyPress=tapPress=false}
const btnEls=[...document.querySelectorAll('#ctl [data-a]')];
function clearInput(){ACT.forEach(a=>{kb[a]=0;tc[a]=0;buf[a]=0});btnEls.forEach(e=>e.classList.remove('on'))}
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',
  Space:'jump',ArrowUp:'jump',KeyW:'jump',KeyZ:'jump',
  KeyJ:'attack',KeyX:'attack',
  KeyK:'dodge',KeyC:'dodge',ShiftLeft:'dodge',ShiftRight:'dodge',
  KeyL:'parry',KeyV:'parry',KeyU:'super',KeyB:'super',KeyQ:'sk1',KeyI:'sk1',KeyE:'sk2',KeyO:'sk2'};
addEventListener('keydown',e=>{
  unlockAudio();
  if(uiKey(e)){if(!/^F\d/.test(e.code))e.preventDefault();return}
  if(e.code==='Escape'||e.code==='KeyP'){e.preventDefault();if(!e.repeat)pausePress=true;return}
  if(e.code==='Enter'){e.preventDefault();if(!e.repeat)anyPress=true;return}
  const a=keyAct(e.code);if(!a)return;e.preventDefault();
  if(!e.repeat&&!kb[a])press(a);kb[a]=1;
},{passive:false});
addEventListener('keyup',e=>{const a=keyAct(e.code);if(a){kb[a]=0;e.preventDefault()}},{passive:false});
addEventListener('blur',()=>{clearInput();autoPause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInput();autoPause();if(AC)AC.suspend()}else if(AC)AC.resume()});
addEventListener('mousedown',e=>{if(e.button===0){tapPress=true;unlockAudio()}});

/* touch: every touch event recomputes the full pressed set from e.touches,
   so multi-touch, sliding between buttons and release are always exact */

    if(b.vx>0)b.x=s.x-b.w;else if(b.vx<0)b.x=s.x+s.w;else{const l=b.x+b.w-s.x,r=s.x+s.w-b.x;if(l<r)b.x=s.x-b.w;else b.x=s.x+s.w}
    b.vx=0;b.hitWall=true}}
  const pb=b.y+b.h;b.y+=b.vy;b.onGround=false;b.groundRef=null;
  for(const s of world.solids){if(s.gone)continue;if(overlap(b,s)){
    if(b.vy>0){b.y=s.y-b.h;b.onGround=true;b.groundRef=s}else if(b.vy<0)b.y=s.y+s.h;b.vy=0}}

}

function runAtk(b){
  const s=b.cur;
  if(b.st==='wind'){
    if(b.t===1&&b.windFx)b.windFx(s);
    if(s.feintAt&&b.t===s.feintAt){b.t=0;s.feintAt=0;s.wt=s.realWt;s.fake=false;fxText(b.x+b.w/2,b.y-16,'！','#ffcf9a',22)}

    if(s.heavy&&!s.feintAt&&b.t%3===0&&b.t<s.wt-3){const g=b.tip?b.tip():{x:b.x+b.w/2,y:b.y};conv(g.x,g.y,2,s.parry?'255,240,230':'255,60,40',54)}
    if(b.t>=s.wt){b.st='act';b.t=0;b.hitDone=false;if(s.onAct)s.onAct(b);if(b.actFx)b.actFx(s);sfx(s.heavy?'heavy':'swing')}
  }else if(b.st==='act'){
    if(s.during)s.during(b);
    if(!b.hitDone&&b.t<=s.act&&s.box){const r=s.box(b);if(r)b.hitDone=atk(r,{dmg:s.dmg,parry:s.parry,x:b.x+b.w/2,owner:b,cause:s.cause,tip:s.tip})}
    if(b.t===s.act&&b.endFx)b.endFx(s);
    if(b.t>s.act){b.st='rec';b.t=0}
  }else if(b.st==='rec'){if(b.t>=s.rec)b.next()}
}

  if(clear)b+=8000+Math.max(0,Math.round((1200-sec)*8))+(G.rank?G.rank.score*60:0);
  b-=G.deaths*250+s.hits*60;return Math.max(0,Math.round(b*DF().mult))}

/* ================= v8: BOSS OVERHAUL (phases / adaptive AI / new patterns) ================= */
/* per-difficulty boss tuning. rec = recovery multiplier, wt = wind-up multiplier (min 12f so the glint is always readable),
   ai = how strongly bosses read the player, ph = extra speed per phase (1..4) */
const BT=[{rec:.8,wt:.95,ai:.55,ph:[1,1.05,1.12,1.2]},{rec:.62,wt:.9,ai:.8,ph:[1,1.08,1.16,1.28]},{rec:.46,wt:.84,ai:1,ph:[1,1.1,1.22,1.36]},{rec:.36,wt:.78,ai:1,ph:[1,1.12,1.26,1.42]}];
const BTi=()=>BT[G.diff|0]||BT[0];
const pWin=()=>G.diff>=2&&world&&world.bossOn?(G.diff>=3?7:8):PARRY_WIN,dWin=()=>G.diff>=2&&world&&world.bossOn?(G.diff>=3?10:11):DODGE_IF;
function tuneSpec(s){if(!s)return s;const T=BTi();if(s.wt<900)s.wt=Math.max(12,Math.round(s.wt*T.wt));if(s.realWt)s.realWt=Math.max(10,Math.round(s.realWt*T.wt));if(typeof s.rec==='number')s.rec=Math.max(3,Math.round(s.rec*T.rec));return s}

  if(p.st!==A.ps){if(p.st==='atk'||p.st==='mv'||p.st==='charge'){A.atk++;A.aT=G.time}else if(p.st==='dodge'){A.dodge++;A.dT=G.time;A.ddir=Math.sign(p.vx)||p.face}
    else if(p.st==='parry'){A.parry++;A.pT=G.time}else if(p.st==='skill'&&p.sk){A.skill++;A.skT=G.time;if(p.sk.id===A.lastSk)A.skRep++;else{A.skRep=1;A.lastSk=p.sk.id}}A.ps=p.st}
  if(A.g&&!p.onGround&&p.vy<0)A.jump++;A.g=p.onGround;
  const b=world.boss;if(b&&!b.dead&&world.bossOn){const d=Math.abs(pcx()-(b.x+b.w/2));if(d>260)A.far+=.02;else if(d<140)A.near+=.02}}
