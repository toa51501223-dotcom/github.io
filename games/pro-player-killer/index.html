<script>
(()=>{
'use strict';
/* =========================================================
   PRO PLAYER KILLER
   ========================================================= */
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const H=470,GY=440;
let VW=960,VH=540,S=1,DPR=1,offY=0,groundSY=440,frame=0,touchMode=false;
const SAFE={l:0,r:0,t:0,b:0};
const FS='"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Times New Roman",serif';
const FG='"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif';
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a);
const ease=t=>1-(1-t)*(1-t);
const hash=n=>{const s=Math.sin(n*12.9898+78.233)*43758.5453;return s-Math.floor(s)};
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

/* ---------------- INPUT ---------------- */
const ACT=['left','right','jump','attack','dodge','parry','super'];
const kb={},tc={},buf={};ACT.forEach(a=>{kb[a]=0;tc[a]=0;buf[a]=0});
let anyPress=false,tapPress=false,pausePress=false;
const BUF=9;
const held=a=>!!(kb[a]||tc[a]||(typeof gp!=='undefined'&&gp[a]));
const lastTap={};function press(a){buf[a]=BUF;anyPress=true;if(a==='left'||a==='right'){if(frame-(lastTap[a]===undefined?-99:lastTap[a])<14)G.dashReq=a;lastTap[a]=frame}}
function consume(a){if(buf[a]>0){buf[a]=0;return true}return false}
function clearBuf(){ACT.forEach(a=>buf[a]=0);anyPress=tapPress=false}
const btnEls=[...document.querySelectorAll('#ctl [data-a]')];
function clearInput(){ACT.forEach(a=>{kb[a]=0;tc[a]=0;buf[a]=0});btnEls.forEach(e=>e.classList.remove('on'))}
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',
  Space:'jump',ArrowUp:'jump',KeyW:'jump',KeyZ:'jump',
  KeyJ:'attack',KeyX:'attack',
  KeyK:'dodge',KeyC:'dodge',ShiftLeft:'dodge',ShiftRight:'dodge',
  KeyL:'parry',KeyV:'parry',KeyU:'super',KeyB:'super'};
addEventListener('keydown',e=>{
  unlockAudio();
  if(uiKey(e)){if(!/^F\d/.test(e.code))e.preventDefault();return}
  if(e.code==='Escape'||e.code==='KeyP'){e.preventDefault();if(!e.repeat)pausePress=true;return}
  if(e.code==='Enter'){e.preventDefault();if(!e.repeat)anyPress=true;return}
  const a=keyAct(e.code);if(!a)return;e.preventDefault();
  if(!e.repeat&&!kb[a])press(a);kb[a]=1;
},{passive:false});
addEventListener('keyup',e=>{const a=keyAct(e.code);if(a){kb[a]=0;e.preventDefault()}},{passive:false});
addEventListener('blur',()=>{clearInput();autoPause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInput();autoPause();if(AC)AC.suspend()}else if(AC)AC.resume()});
addEventListener('mousedown',e=>{if(e.button===0){tapPress=true;unlockAudio()}});

/* touch: every touch event recomputes the full pressed set from e.touches,
   so multi-touch, sliding between buttons and release are always exact */
let rects=[];
function measure(){
  rects=btnEls.filter(el=>el.offsetWidth>0).map(el=>{const r=el.getBoundingClientRect();const pad=Math.min(12,r.width*.14);
    return{a:el.dataset.a,el,l:r.left-pad,t:r.top-pad,r:r.right+pad,b:r.bottom+pad,cx:(r.left+r.right)/2,cy:(r.top+r.bottom)/2,top:r.top}});
}
function hitBtn(x,y){let best=null,bd=1e9;for(const R of rects){if(x>=R.l&&x<=R.r&&y>=R.t&&y<=R.b){const d=(x-R.cx)**2+(y-R.cy)**2;if(d<bd){bd=d;best=R}}}return best}
function onTouch(e){
  if(e.cancelable)e.preventDefault();
  if(uiBusy()){for(const a of ACT)tc[a]=0;for(const R of rects)R.el.classList.remove('on');if(e.type==='touchend'){unlockAudio();if(!touchMode){touchMode=true;applyTouchVis()}}return}

  if(!touchMode)setTouchMode();
  const now={};
  for(let i=0;i<e.touches.length;i++){const t=e.touches[i];const R=hitBtn(t.clientX,t.clientY);if(R)now[R.a]=1}
  if(e.type==='touchstart'){
    for(let i=0;i<e.changedTouches.length;i++){const t=e.changedTouches[i];const R=hitBtn(t.clientX,t.clientY);
      if(!R)tapPress=true;else if(R.a==='pause')pausePress=true}
  }
  for(const a of ACT){const v=now[a]?1:0;if(v&&!tc[a])press(a);tc[a]=v}
  for(const R of rects)R.el.classList.toggle('on',!!now[R.a]);
  if(e.type==='touchend'||e.type==='touchcancel'){
    if(e.touches.length===0){ACT.forEach(a=>tc[a]=0);btnEls.forEach(el=>el.classList.remove('on'))}
    unlockAudio();
    if(wantFS){wantFS=false;tryFullscreen()}
  }
}
['touchstart','touchmove','touchend','touchcancel'].forEach(t=>document.addEventListener(t,onTouch,{passive:false}));
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());
addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
let wantFS=true;
function tryFullscreen(){
  const el=document.documentElement;
  const isIOS=/iP(hone|od|ad)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(isIOS||document.fullscreenElement)return;
  const rq=el.requestFullscreen||el.webkitRequestFullscreen;
  if(!rq)return;
  try{const p=rq.call(el,{navigationUI:'hide'});
    const lock=()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(_){}};
    if(p&&p.then)p.then(lock).catch(()=>{});else lock();
  }catch(_){}
}
function setTouchMode(){touchMode=true;applyTouchVis();resize()}

/* ---------------- LAYOUT ---------------- */
let vig=null;
function resize(){
  const vw=Math.max(1,window.innerWidth),vh=Math.max(1,window.innerHeight);
  DPR=Math.min(window.devicePixelRatio||1,touchMode?1.75:2);
  cvs.width=Math.round(vw*DPR);cvs.height=Math.round(vh*DPR);
  cvs.style.width=vw+'px';cvs.style.height=vh+'px';
  S=vh/H;if(vw/S<700)S=vw/700;
  VW=vw/S;VH=vh/S;
  const sp=getComputedStyle(document.getElementById('safe'));
  SAFE.t=parseFloat(sp.paddingTop)||0;SAFE.r=parseFloat(sp.paddingRight)||0;SAFE.b=parseFloat(sp.paddingBottom)||0;SAFE.l=parseFloat(sp.paddingLeft)||0;
  document.body.classList.toggle('portrait',touchMode&&vh>vw);
  applyLayout();
  measure();
  groundSY=VH-100;
  if(document.body.classList.contains('touch')&&vw>=vh){
    let top=vh;for(const id of BTN_IDS){const c=LAY[id];if(!c.v||c.y<.5)continue;top=Math.min(top,c.y*vh-bsize(id).h/2)}
    groundSY=Math.min(VH-100,top/S-6);
    groundSY=Math.max(groundSY,Math.min(VH*.66,VH-100));
  }
  offY=groundSY-GY;
  document.documentElement.style.setProperty('--tty',Math.round((Math.min(VH*.28,groundSY*.42)+Math.min(64,VW*.07)*.75+28)*S)+'px');
  vig=null;vigR=null;SKYC={};
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>{setTimeout(resize,120);setTimeout(resize,500)});
if(window.visualViewport)visualViewport.addEventListener('resize',resize);
function autoPause(){if(G.mode==='play'&&!G.clearT&&!uiBusy())openPause()}

/* ---------------- AUDIO ---------------- */
let AC=null,master=null,noiseBuf=null;
function unlockAudio(){

  try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();master=AC.createGain();master.gain.value=.32;master.connect(AC.destination);applyAudio();
    noiseBuf=AC.createBuffer(1,AC.sampleRate*.6,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const o=AC.createOscillator(),g=AC.createGain();g.gain.value=0;o.connect(g);g.connect(master);o.start();o.stop(AC.currentTime+.02);
    setTimeout(()=>{const w=MUS.want;MUS.name=undefined;playMusic(w)},0);
  }catch(_){AC=null}
}

  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(sfxBus||master);s.start(t);s.stop(t+d+.02)}

/* ---- death-driven world mutation ---- */
function computeMut(){
  const n=G.stageDeaths,h=habit(),R=mulberry(n*131+G.stage*17+G.deaths*7+5);
  const m={spd:1,grav:1,feint:false,delayed:false,armor:false,predict:false,hidden:false,blades:false,phantom:false};
  m.spd=+(1+Math.min(.28,n*.04+(n>0?R()*.04:0))).toFixed(2);
  if(n>=2){const gs=[.84,1,1.16];m.grav=gs[Math.floor(R()*3)]}
  m.feint=n>=1&&(h.parry>.16||n>=3);
  m.delayed=n>=1&&(h.dodge>.2||h.parry>.2||n>=4);
  m.armor=n>=2&&h.attack>.42;
  m.predict=n>=2&&(h.jump>.24||n>=4);
  m.hidden=n>=1||G.stage>=1;
  m.blades=n>=3||G.stage>=1;
  m.phantom=n>=4;
  return m;
}
function mutMsgs(o,m){const a=[];
  if(m.spd>o.spd+.001)a.push(`敵の攻撃速度 ×${m.spd.toFixed(2)}`);
  if(m.grav!==o.grav)a.push(m.grav<1?`重力が弱まった（${m.grav}G）― 跳躍が高く、滞空が長い`:m.grav>1?`重力が強まった（${m.grav}G）― 跳躍が低い`:'重力が元に戻った（1.0G）');
  if(m.feint&&!o.feint)a.push('パリィ癖を読まれた：敵がフェイントを使い始めた');
  if(m.delayed&&!o.delayed)a.push('敵が「遅延攻撃」を覚えた ― 白い閃光まで待て');
  if(m.armor&&!o.armor)a.push('連打癖を検知：敵が振りかぶり中に怯まなくなった');
  if(m.predict&&!o.predict)a.push('跳躍・移動を予測した射撃が始まった');
  if(m.hidden&&!o.hidden)a.push('安全に見える床に隠し棘が仕込まれた');

  for(const s of world.solids)if(!s.gone&&px>=s.x&&px<=s.x+s.w&&py>=s.y&&py<=s.y+s.h)return true;
  for(const p of world.plats)if(!p.gone&&px>=p.x&&px<=p.x+p.w&&py>=p.y-2&&py<=p.y+14)return true;
  return false;
}

  for(let i=0;i<10;i++)mid.push({x:i*260+R()*120,h:70+R()*130,k:R(),s:R()*6});
  for(let i=0;i<46;i++)amb.push({x:R()*1600,y:R()*600,v:.2+R()*.7,s:.6+R()*2,p:R()*6});

  for(let i=0;i<9;i++)fore.push({x:i*300+R()*140,h:28+R()*40,k:R()});

  const plat=(x,y,wd,ex)=>{const p=Object.assign({x,y,w:wd,h:14,y0:y},ex||{});w.plats.push(p);return p};

function moveBody(b,grav,noGrav){
  if(!noGrav)b.vy=Math.min(b.vy+.55*grav,13);
  b.x+=b.vx;b.hitWall=false;
  for(const s of world.solids){if(s.gone)continue;if(overlap(b,s)){
    if(b.vx>0)b.x=s.x-b.w;else if(b.vx<0)b.x=s.x+s.w;else{const l=b.x+b.w-s.x,r=s.x+s.w-b.x;if(l<r)b.x=s.x-b.w;else b.x=s.x+s.w}
    b.vx=0;b.hitWall=true}}
  const pb=b.y+b.h;b.y+=b.vy;b.onGround=false;b.groundRef=null;
  for(const s of world.solids){if(s.gone)continue;if(overlap(b,s)){
    if(b.vy>0){b.y=s.y-b.h;b.onGround=true;b.groundRef=s}else if(b.vy<0)b.y=s.y+s.h;b.vy=0}}
  if(b.vy>=0)for(const p of world.plats){if(p.gone)continue;
    if(b.x+b.w>p.x&&b.x<p.x+p.w&&pb<=p.y+.5&&b.y+b.h>=p.y){b.y=p.y-b.h;b.vy=0;b.onGround=true;b.groundRef=p}}
}

    if(s.feintAt&&b.t===s.feintAt){b.t=0;s.feintAt=0;s.wt=s.realWt;s.fake=false;fxText(b.x+b.w/2,b.y-16,'！','#ffcf9a',22)}

function playMusic(name){MUS.want=name;if(!AC)return;if(MUS.name===name&&MUS.bus)return;const now=AC.currentTime;
  if(MUS.bus){const old=MUS.bus;old.gain.cancelScheduledValues(now);old.gain.setValueAtTime(old.gain.value,now);old.gain.linearRampToValueAtTime(0,now+.9);setTimeout(()=>{try{old.disconnect()}catch(_){}},1300)}
  MUS.name=name;MUS.track=name?TR[name]:null;MUS.bus=null;if(!name)return;
  const out=musOut(),g=AC.createGain();g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(MUS.track.vol,now+.6);g.connect(out);MUS.bus=g;
  try{MUS.shaper.disconnect()}catch(_){}MUS.shaper.connect(g);MUS.step=0;MUS.next=now+.08}
setInterval(()=>{if(!AC||!MUS.track||!MUS.bus||AC.state!=='running')return;const q=60/MUS.track.bpm/4;
  if(MUS.next<AC.currentTime-.25)MUS.next=AC.currentTime+.05;
  while(MUS.next<AC.currentTime+.14){try{MUS.track.play(MUS.step,MUS.next,MUS.bus,q)}catch(e){}MUS.next+=q;MUS.step++}},30);

  for(const s of segs){if(s.x+40>x)continue;const px=Math.min(x,s.x+s.w-40);if(!best||px>best)best=px}

const dirty=()=>G.mode==='play'&&G.time!==G.savedTime;
function goTitle(){fadeTo(()=>{closeAll();G.paused=false;G.mode='title';world=null;fx.length=0;G.cut=null;playMusic('title');openTitle()})}
function toTitleAsk(){if(dirty())confirmBox('セーブしていない進行状況があります。<br>タイトル画面に戻りますか？',[['セーブして戻る',()=>openSlots('save',goTitle),'gold'],['保存せず戻る',goTitle,'red'],['キャンセル']]);else goTitle()}
function openSlots(mode,after){const p=el('div','panel');p.appendChild(el('div','hd',mode==='save'?'セーブ':'ロード'));const list=el('div','slots');
  allSlots().forEach((d,i)=>{let sub;if(d.empty)sub='― 空き ―';else if(d.corrupt)sub='⚠ データが破損しています';else sub=`${d.stageName}${d.cp?'（ボス前）':''}　${fmtDate(d.time)}<br>HP ${d.hp}/${d.maxhp}　撃破 ${d.kills||0}　死亡 ${d.deaths}　プレイ ${fmtTime(d.playTime||0)}`;
    list.appendChild(mi(`スロット ${i+1}`,()=>slotAct(mode,i,d,after),{sub,cls:'slot'+(d.corrupt?' bad':'')}))});
  p.appendChild(list);p.appendChild(mi('戻る',()=>popPanel(),{cls:'back'}));pushPanel(p,()=>popPanel())}
function slotAct(mode,i,d,after){
  if(mode==='save'){const go=()=>{if(doSave(i)){popPanel();toast(`スロット${i+1}にセーブしました`);if(after)after()}};
    if(canSave()){toast(canSave());return}
    if(!d.empty)confirmBox(`スロット${i+1}のデータを上書きしますか？`,[['上書きする',go,'red'],['やめる']]);else go();return}
  if(d.empty){confirmBox('このスロットにはセーブデータがありません',[['OK']]);return}
  if(d.corrupt){confirmBox('データが破損しているため読み込めません',[['OK'],['このデータを削除',()=>{lsDel(SKEY(i));popPanel();openSlots(mode,after)},'red']]);return}
  confirmBox(`スロット${i+1}をロードしますか？<br><small>${d.stageName}　${fmtDate(d.time)}${G.mode==='play'?'<br>現在の進行状況は失われます':''}</small>`,[['ロードする',()=>fadeTo(()=>{closeAll();loadSave(d)}),'red'],['やめる']])}
let curTab=null;
function rerenderTab(){if(curTab)curTab()}
function openSettings(tab){const p=el('div','panel wide');p.appendChild(el('div','hd','SETTINGS'));const tabs=el('div','tabs'),body=el('div','tbody');
  const T=[['サウンド',renderSound],['操作',renderControls],['その他',renderOther]];let cur=tab||0;
  const show=i=>{cur=i;[...tabs.children].forEach((t,j)=>t.classList.toggle('act',i===j));body.innerHTML='';T[i][1](body);refreshSel()};curTab=()=>show(cur);
  T.forEach(([l],i)=>tabs.appendChild(mi(l,()=>show(i),{cls:'tab'})));p.appendChild(tabs);p.appendChild(body);
  const close=()=>{saveSettings();curTab=null;UI.capture=null;popPanel()};p.appendChild(mi('閉じる',close,{cls:'back'}));pushPanel(p,close);show(cur);dragScroll(body)}
function renderSound(b){const pc=v=>Math.round(v*100)+'%';
  b.appendChild(slider('マスター音量',()=>SET.vol.master,v=>{SET.vol.master=v;applyAudio()},0,1,pc));
  b.appendChild(slider('BGM',()=>SET.vol.bgm,v=>{SET.vol.bgm=v;applyAudio()},0,1,pc));
  const se=slider('効果音',()=>SET.vol.se,v=>{SET.vol.se=v;applyAudio()},0,1,pc);se._done=()=>sfx('hit');b.appendChild(se)}
function renderControls(b){
  b.appendChild(mi('配置を編集する',()=>openEditor(),{cls:'gold',sub:'タッチボタンの位置・サイズ・透明度'}));
  b.appendChild(toggle('タッチボタン表示',[['auto','自動'],['on','常に表示'],['off','非表示']],()=>SET.touch,v=>{SET.touch=v;applyTouchVis();resize()}));
  const g=el('div','keys');g.appendChild(el('div','kh','キーボード（クリックで変更）'));
  for(const a of['left','right','jump','attack','dodge','parry','super']){const cust=SET.keys[a];const def=Object.keys(KM).filter(k=>KM[k]===a).slice(0,2).map(keyName).join(' / ');
    g.appendChild(mi(`${ACT_NAME[a]}　<b>${UI.capture===a?'キーを押してください…':cust?keyName(cust):def}</b>`,()=>{UI.capture=a;rerenderTab()},{cls:'key'+(cust?' cust':'')}))}
  g.appendChild(mi('キー設定を初期化',()=>{SET.keys={};saveSettings();rerenderTab();toast('キー設定を初期化しました')},{cls:'key back'}));b.appendChild(g)}
function renderOther(b){
  b.appendChild(slider('画面の揺れ',()=>SET.shake,v=>{SET.shake=v},0,1,v=>Math.round(v*100)+'%'));
  b.appendChild(toggle('閃光・反転演出',[[true,'ON'],[false,'OFF（控えめ）']],()=>SET.flash,v=>{SET.flash=v}));
  b.appendChild(mi('すべての設定を初期化',()=>confirmBox('音量・キー・ボタン配置などをすべて初期化しますか？<br><small>セーブデータは消えません</small>',[['初期化する',()=>{const d=defSet();Object.assign(SET,d);LAY=defLayout();SET.layout=null;saveSettings();applyAudio();applyTouchVis();resize();rerenderTab();toast('設定を初期化しました')},'red'],['やめる']]),{cls:'back'}))}
function dragScroll(box){let y0=null,s0=0;box.addEventListener('pointerdown',e=>{if(e.target.closest('.tr'))return;y0=e.clientY;s0=box.scrollTop});box.addEventListener('pointermove',e=>{if(y0!==null&&e.pointerType!=='mouse')box.scrollTop=s0-(e.clientY-y0)});
  const end=()=>{y0=null};box.addEventListener('pointerup',end);box.addEventListener('pointercancel',end)}

/* ---------- button layout editor ---------- */
const EDP=document.getElementById('edp');
function openEditor(){if(!LAY)LAY=defLayout();EDIT={prev:JSON.parse(JSON.stringify(LAY)),sel:'attack',drag:null};G.editing=true;document.body.classList.add('editing');clearInput();buildEditor();applyLayout()}
function editorClose(save){if(!EDIT)return;if(save){SET.layout=LAY;saveSettings();toast('ボタン配置を保存しました')}else LAY=EDIT.prev;
  EDIT=null;G.editing=false;document.body.classList.remove('editing');EDP.innerHTML='';applyLayout();resize();refreshSel()}
function buildEditor(){EDP.innerHTML='';const id=EDIT.sel,c=LAY[id];
  EDP.appendChild(el('div','eh',`ボタン配置の編集　<span>${ACT_NAME[id]}</span>`));EDP.appendChild(el('div','ehint','ボタンをドラッグして移動／タップで選択'));
  const pc=v=>Math.round(v*100)+'%';const rw=el('div','erow');
  rw.appendChild(slider('サイズ',()=>LAY[EDIT.sel].s,v=>{LAY[EDIT.sel].s=v;applyLayout()},.5,1.7,pc));
  rw.appendChild(slider('透明度',()=>LAY[EDIT.sel].a,v=>{LAY[EDIT.sel].a=v;applyLayout()},.15,1,pc));
  rw.appendChild(toggle('表示',[[true,'表示'],[false,'非表示']],()=>LAY[EDIT.sel].v,v=>{LAY[EDIT.sel].v=v;applyLayout()}));EDP.appendChild(rw);
  const bt=el('div','erow btns');bt.appendChild(mi('初期配置に戻す',()=>{LAY=defLayout();applyLayout();buildEditor()},{cls:'back'}));bt.appendChild(mi('キャンセル',()=>editorClose(false),{cls:'back'}));bt.appendChild(mi('保存',()=>editorClose(true),{cls:'gold'}));EDP.appendChild(bt);
  EDP.classList.toggle('low',c.y<.5)}
for(const id of BTN_IDS){const e=btnEl(id);if(!e)continue;let off=null;
  e.addEventListener('pointerdown',ev=>{if(!G.editing)return;ev.preventDefault();ev.stopPropagation();EDIT.sel=id;EDIT.drag=id;const r=e.getBoundingClientRect();off={x:ev.clientX-(r.left+r.width/2),y:ev.clientY-(r.top+r.height/2)};try{e.setPointerCapture(ev.pointerId)}catch(_){}buildEditor();applyLayout()});
  e.addEventListener('pointermove',ev=>{if(!G.editing||!off)return;LAY[id].x=(ev.clientX-off.x)/innerWidth;LAY[id].y=(ev.clientY-off.y)/innerHeight;applyLayout()});
  const up=()=>{if(!G.editing||!off)return;off=null;applyLayout();EDIT.drag=null;applyLayout();buildEditor()};e.addEventListener('pointerup',up);e.addEventListener('pointercancel',up)}

/* ---------------- LOOP ---------------- */
let last=performance.now(),acc=0;const STEP=1000/60;let lastDcd=-1;
function timeScale(dt){if(G.slowMs>0){G.slowMs-=dt;const u=clamp(G.slowMs/G.slowTot,0,1);return u>.45?G.slowMin:lerp(1,G.slowMin,u/.45)}return 1}
function loop(now){
  requestAnimationFrame(loop);
  let dt=now-last;last=now;if(dt>100)dt=100;if(dt<0)dt=0;acc+=dt*(G.mode==='play'&&(G.paused||uiBusy())?1:timeScale(dt));let n=0;
  while(acc>=STEP&&n<5){try{snap();tick()}catch(e){console.error(e)}acc-=STEP;n++}
  if(n>=5)acc=0;
  IA=clamp(acc/STEP,0,1);
  try{render()}catch(e){console.error(e)}
  {const pl=G.mode==='play';if(pl!==document.body.classList.contains('playing')){document.body.classList.toggle('playing',pl);measure()}}
  {const sr=!!(touchMode&&player&&G.mode==='play'&&(player.sg||0)>=100);if(sr!==document.body.classList.contains('supready')){document.body.classList.toggle('supready',sr);measure()}}
  if(touchMode&&player){const c=player.dcd>0?1:0;if(c!==lastDcd){lastDcd=c;const el=btnEls.find(e=>e.dataset.a==='dodge');if(el)el.classList.toggle('cd',!!c)}}
}
if((window.matchMedia&&matchMedia('(pointer:coarse)').matches)||('ontouchstart' in window&&navigator.maxTouchPoints>0)){touchMode=true}
applyTouchVis();
resize();setTimeout(resize,300);openTitle();
requestAnimationFrame(loop);
window.__ppk={G,press,buf,SET,UI,get LAY(){return LAY},openPause,resume,doSave,readSlot,loadSave,latestSave,applyLayout,openEditor,editorClose,goTitle,C:{Ghoul,Archer,Lancer,Exe,Witch,Pro},get player(){return player},get world(){return world},startBoss:()=>{player.x=world.arenaX+80;},tick};
})();
</script>
