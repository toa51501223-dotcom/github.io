<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#03060f">
<title>LUMEN GRID | QUVERIS</title>
<link rel="icon" href="thumb.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">LUMEN<b>GRID</b></div>
    <div class="meta">
      <div><span>STAGE</span><b id="stage">01</b></div>
      <div><span>MOVES</span><b id="moves">0</b></div>
      <div><span>LIT</span><b id="lit">0</b></div>
    </div>
  </header>

  <main class="board-wrap">
    <div class="board" id="board" role="grid" aria-label="盤面"></div>
    <div class="clear" id="clear" hidden>
      <div class="clear__box">
        <span class="clear__tag">STAGE CLEAR</span>
        <strong id="clear-title">01</strong>
        <p id="clear-text"></p>
        <button type="button" class="btn" id="next">NEXT STAGE →</button>
      </div>
    </div>
  </main>

  <footer class="tools">
    <button type="button" class="tool" id="undo"><span>↶</span>1手戻す</button>
    <button type="button" class="tool" id="reset"><span>⟲</span>リセット</button>
    <button type="button" class="tool" id="hint"><span>✦</span>ヒント</button>
    <button type="button" class="tool" id="sound" aria-pressed="false"><span>♪</span>サウンド</button>
  </footer>
  <p class="help">タイルを押すと、そのタイルと上下左右が反転。すべて消灯でクリア。</p>
</div>
<noscript>このゲームを遊ぶには JavaScript を有効にしてください。</noscript>
<script src="game.js"></script>
</body>
</html>
